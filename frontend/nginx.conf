# CMPC-libros: SPA estática + reverse proxy de la API (mismo origen).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Las imágenes admiten hasta 2 MB; el margen cubre el overhead de multipart.
    client_max_body_size 3m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Los add_header de cada location se suman a los de este nivel.
    add_header_inherit merge;

    # "/api" sin barra final no es una ruta de la SPA.
    location = /api {
        return 404;
    }

    # API: se reenvía sin reescribir la ruta (el backend usa el prefijo global /api).
    location /api/ {
        # helmet ya define las cabeceras de seguridad de la API; evita duplicarlas.
        add_header_inherit off;
        error_page 413 = @payload_too_large;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # La exportación CSV se transmite en streaming: sin buffer intermedio.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Cuerpo demasiado grande: mismo formato de error que el resto de la API.
    location @payload_too_large {
        default_type application/json;
        charset utf-8;
        charset_types application/json;
        return 413 '{"statusCode":413,"error":"Payload Too Large","message":"El archivo supera el tamaño máximo permitido","path":"$uri","timestamp":"$time_iso8601","requestId":"$request_id"}';
    }

    # Assets con hash en el nombre: caché inmutable de un año.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: cualquier otra ruta la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
